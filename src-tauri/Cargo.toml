[package]
name = "budg"
version = "0.1.0"
description = "Le budget commun, simplement"
authors = ["BUDG"]
edition = "2021"
[lib]
name = "budg_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
