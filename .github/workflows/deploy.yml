name: Verify and deploy BUDG

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: budg-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Tests and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: budg_ci
          POSTGRES_PASSWORD: budg_ci_test_only
          POSTGRES_DB: budg_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U budg_ci -d budg_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://budg_ci:budg_ci_test_only@127.0.0.1:5432/budg_ci
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test application and PostgreSQL integration
        run: npm test

      - name: Test deployment safeguards
        run: python3 -m unittest discover -s scripts/deploy -p 'test_*.py'

      - name: Build online application
        run: npm run build:online

      - name: Package application code
        run: tar -czf budg-release.tar.gz dist server-dist app.cjs package.json package-lock.json

      - name: Preserve verified build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node.js 24
        with:
          name: budg-online-${{ github.sha }}
          path: budg-release.tar.gz
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  deploy:
    name: Update budg.prjski.com
    needs: verify
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Retrieve verified build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7, Node.js 24
        with:
          name: budg-online-${{ github.sha }}

      - name: Deploy and verify the running version
        env:
          BUDG_SSH_PRIVATE_KEY: ${{ secrets.BUDG_SSH_PRIVATE_KEY }}
          BUDG_SSH_KNOWN_HOSTS: ${{ secrets.BUDG_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BUDG_SSH_PRIVATE_KEY" || { echo 'Missing BUDG deployment key.' >&2; exit 1; }
          test -n "$BUDG_SSH_KNOWN_HOSTS" || { echo 'Missing verified BUDG host key.' >&2; exit 1; }
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          umask 077
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/budg-ssh.XXXXXX")
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$BUDG_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$BUDG_SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          checksum=$(sha256sum budg-release.tar.gz)
          archive_sha=${checksum%% *}
          ssh -T -p 5022 -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ForwardAgent=no -o ClearAllForwardings=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            ghmhtrcg@node176-eu.n0c.com \
            "deploy $GITHUB_SHA $archive_sha" < budg-release.tar.gz
